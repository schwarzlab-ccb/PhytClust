# Example settings file for `phytclust --config`.
# Every field is described in docs/reference.md; unset fields keep their defaults.

runtime:
  plot:
    cluster:
      width_scale: 2.5
      height_scale: 0.30
      marker_size: 40
      show_branch_lengths: false
      hide_internal_nodes: true

    scores:
      score_plot_from_k3: false
      show_secondary_score_plot: false
      clamp_negative_to_zero: true
      fig_width: 18
      fig_height: 10
      x_axis_mode: "log"
      log_scale_y: true
      title_fontsize: 50
      axis_label_fontsize: 35
      tick_labelsize: 30
      peak_labelsize: 50

  save:
    tsv_name: "phytclust_results.tsv"
    outlier: true

peak:
  prominence_weight: 0.7
  ranking_mode: "adjusted"
  min_k: 2
  resolution_fallback_mode: "none"
