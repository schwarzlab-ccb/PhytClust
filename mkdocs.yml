site_name: PhytClust
site_description: Efficient and Optimal Monophyletic Partitioning of Rooted Phylogenetic Trees
site_url: https://schwarzlab-ccb.github.io/PhytClust/
repo_name: schwarzlab-ccb/PhytClust
repo_url: https://github.com/schwarzlab-ccb/PhytClust

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - How It Works: concepts.md
  - Visualisation: visualisation.md
  - Tutorials:
      - CLI End-to-End: tutorials/cli-end-to-end.md
      - Python End-to-End: tutorials/python-end-to-end.md
  - Reference: reference/index.md
