site_name: PhytClust
site_description: Efficient and Optimal Monophyletic Partitioning of Rooted Phylogenetic Trees
site_url: https://schwarzlab-ccb.github.io/PhytClust/
repo_name: schwarzlab-ccb/PhytClust
repo_url: https://github.com/schwarzlab-ccb/PhytClust

theme:
  name: material
  logo: img/phytclust_logo.png
  favicon: img/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Usage: usage.md
  - How it works: concepts.md
  - Reference: reference.md
